<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelinha do bachira monstro</title>
</head>
<body>
    <table>
        <caption>Horario do treino</caption>
        <!--pra dar o titulo da tabela usar capition-->
        <thead> <!--cabeçario da tabela-->
            <tr><!--linhas da tabela-->
                <th scope="col">dia da semana</th>
                <th scope="col">unidade na Blue Lock</th>
                <th scope="col">horário</th>
            </tr>
             <tr>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
            </tr>
        </thead>
        <tbody><!--corpo da tabela-->
            <tr>
                <td>Segunda-Feira</td>
                <td>academia</td>
                <td>15:00</td>
            </tr>
            <tr>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
            </tr>
            <tr>
                <td>Terça-Feira</td>
                <td>Campo de trainamento do time</td>
                <td>15:30</td>
            </tr>
        </tbody>
         <tr>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
                <td>
                    <hr>
                </td>
            </tr>
        <tfoot><!--rodapé da tabela-->
            <tr>
                <td colespan="3">intervalo: 12:00 até 13:00 </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
